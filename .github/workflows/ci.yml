name: Required CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Required frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check release version consistency
        run: npm run check:versions

      - name: Check shipped demo-data safety
        run: npm run check:demo-data

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Create evidence directory
        run: mkdir -p artifacts

      - name: Run tests
        run: npm run test:ci -- --reporter=junit --outputFile=artifacts/vitest-junit.xml

      - name: Enforce coverage baseline
        run: npm run test:coverage

      - name: Build web assets with a non-secret sentinel
        env:
          BUILD_SECRET_SENTINEL: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
          VITE_GITHUB_TOKEN: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
        run: npm run build:web

      - name: Scan web artifacts for token material
        env:
          BUILD_SECRET_SENTINEL: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
        run: npm run check:build-secrets -- dist

      - name: Enforce clean npm advisory graph
        run: npm audit --json > artifacts/npm-audit-full.json

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-evidence
          path: |
            artifacts/
            coverage/
            dist/
          if-no-files-found: warn
          retention-days: 14

  required-windows-tauri:
    name: Required Windows build and smoke
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.91.0

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Rust SBOM generator
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate npm and Rust dependency SBOMs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          npm sbom --sbom-format cyclonedx |
            Set-Content -LiteralPath artifacts/npm-sbom.cdx.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $sbom = Get-Content -LiteralPath artifacts/npm-sbom.cdx.json -Raw |
            ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX') {
            throw 'npm did not produce a CycloneDX dependency SBOM.'
          }
          Push-Location src-tauri
          try {
            cargo cyclonedx --format json --spec-version 1.5
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }
          $rustSboms = @(Get-ChildItem -LiteralPath src-tauri -File -Filter '*.cdx.json')
          if ($rustSboms.Count -ne 1) {
            throw "Expected one Rust CycloneDX SBOM, found $($rustSboms.Count)."
          }
          Move-Item -LiteralPath $rustSboms[0].FullName `
            -Destination artifacts/rust-sbom.cdx.json -Force
          $rustSbom = Get-Content -LiteralPath artifacts/rust-sbom.cdx.json -Raw |
            ConvertFrom-Json
          if ($rustSbom.bomFormat -ne 'CycloneDX') {
            throw 'cargo-cyclonedx did not produce a CycloneDX dependency SBOM.'
          }

      - name: Check release version consistency
        run: npm run check:versions

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked

      - name: Build unsigned executable for CI smoke testing only
        env:
          BUILD_SECRET_SENTINEL: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
          VITE_GITHUB_TOKEN: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
        run: npm run tauri:build -- --no-bundle --ci

      - name: Scan compiled application artifacts
        env:
          BUILD_SECRET_SENTINEL: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
        run: >-
          npm run check:build-secrets --
          dist
          src-tauri/target/release/respectabullz.exe

      - name: Smoke-launch packaged executable on ephemeral hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $executable = (Resolve-Path 'src-tauri/target/release/respectabullz.exe').Path
          $stdout = Join-Path (Resolve-Path 'artifacts').Path 'smoke-stdout.log'
          $stderr = Join-Path (Resolve-Path 'artifacts').Path 'smoke-stderr.log'
          $evidence = Join-Path (Resolve-Path 'artifacts').Path 'smoke-result.txt'
          $readyMarker = Join-Path $env:APPDATA 'com.respectabullz.app\logs\ci-ready-v1'
          if (Test-Path -LiteralPath $readyMarker) {
            Remove-Item -LiteralPath $readyMarker -Force
          }
          $process = $null
          try {
            $process = Start-Process `
              -FilePath $executable `
              -PassThru `
              -WindowStyle Hidden `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged executable exited during startup with code $($process.ExitCode)."
              }
            } until ((Test-Path -LiteralPath $readyMarker) -or (Get-Date) -ge $deadline)
            if (-not (Test-Path -LiteralPath $readyMarker)) {
              throw 'Packaged executable did not report completed database initialization.'
            }
            $readyValue = (Get-Content -LiteralPath $readyMarker -Raw).Trim()
            if ($readyValue -ne 'ready-v1') {
              throw 'Packaged executable wrote an invalid readiness marker.'
            }
            $stderrText = if (Test-Path -LiteralPath $stderr) {
              (Get-Content -LiteralPath $stderr -Raw).Trim()
            } else {
              ''
            }
            if ($stderrText -match '(?i)(panic|fatal|"level"\s*:\s*"error")') {
              throw 'Packaged executable reported a startup error.'
            }
            "Packaged executable completed database initialization and remained running on the clean, ephemeral GitHub-hosted Windows runner." |
              Set-Content -LiteralPath $evidence -Encoding utf8
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $readyMarker) {
              Remove-Item -LiteralPath $readyMarker -Force
            }
          }

      - name: Create evidence checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $artifactRoot = (Resolve-Path 'artifacts').Path
          $checksumLines = @(Get-ChildItem -LiteralPath $artifactRoot -File -Recurse |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object FullName |
            ForEach-Object {
              $relativePath = [System.IO.Path]::GetRelativePath($artifactRoot, $_.FullName)
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relativePath"
            })
          $checksumLines |
            Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-tauri-ci-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  secret-history:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  rust-advisories:
    name: Required Rust advisory gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use pinned Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup override set 1.91.0

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Enforce documented Rust advisory policy
        working-directory: src-tauri
        run: |
          mkdir -p ../artifacts
          cargo audit --json > ../artifacts/cargo-audit.json

      - name: Upload Rust advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-advisory-evidence
          path: artifacts/cargo-audit.json
          if-no-files-found: warn
          retention-days: 14
