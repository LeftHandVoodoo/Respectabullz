name: Signed Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-windows-release:
    name: Build and verify signed Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.91.0

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tag and version consistency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check:versions
          if ('${{ github.ref_type }}' -ne 'tag') {
            throw 'Signed releases can run only from a version tag.'
          }
          $expectedTag = 'v' + (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ('${{ github.ref_name }}' -ne $expectedTag) {
            throw "Release tag must be $expectedTag."
          }

      - name: Install pinned supply-chain tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Enforce dependency advisory policies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          npm audit --json |
            Set-Content -LiteralPath artifacts/npm-audit-full.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Push-Location src-tauri
          try {
            cargo audit --json |
              Set-Content -LiteralPath ../artifacts/cargo-audit.json -Encoding utf8
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }

      - name: Run required frontend and Rust checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check:demo-data
          npm run lint
          npm run typecheck
          npm run test:ci
          npm run test:coverage
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked

      - name: Generate dependency SBOMs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm sbom --sbom-format cyclonedx |
            Set-Content -LiteralPath artifacts/npm-sbom.cdx.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Push-Location src-tauri
          try {
            cargo cyclonedx --format json --spec-version 1.5
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }
          $rustSboms = @(Get-ChildItem -LiteralPath src-tauri -File -Filter '*.cdx.json')
          if ($rustSboms.Count -ne 1) {
            throw "Expected one Rust CycloneDX SBOM, found $($rustSboms.Count)."
          }
          Move-Item -LiteralPath $rustSboms[0].FullName `
            -Destination artifacts/rust-sbom.cdx.json -Force

      - name: Import release certificate and create signing configuration
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'The release environment is missing WINDOWS_CERTIFICATE_BASE64.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'The release environment is missing WINDOWS_CERTIFICATE_PASSWORD.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw 'The release environment is missing WINDOWS_TIMESTAMP_URL.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'respectabullz-signing.pfx'
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-signing.json'
          [System.IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password)
          $certificate = $imported |
            Where-Object HasPrivateKey |
            Select-Object -First 1
          if (-not $certificate) {
            throw 'The supplied PFX did not contain a certificate with a private key.'
          }
          if ($certificate.NotAfter -le (Get-Date)) {
            throw 'The supplied code-signing certificate is expired.'
          }
          $codeSigningEku = '1.3.6.1.5.5.7.3.3'
          if (-not ($certificate.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningEku)) {
            throw 'The supplied certificate is not authorized for code signing.'
          }

          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          }
          $overlay | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath $configPath -Encoding utf8
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_CONFIG=$configPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed Windows installer
        env:
          BUILD_SECRET_SENTINEL: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
          VITE_GITHUB_TOKEN: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
        run: npm run tauri:build -- --ci --config $env:TAURI_SIGNING_CONFIG

      - name: Scan and verify release signatures
        shell: pwsh
        env:
          BUILD_SECRET_SENTINEL: RB009_BUILD_SECRET_SENTINEL_DO_NOT_BUNDLE_000000000000
        run: |
          $ErrorActionPreference = 'Stop'
          npm run check:build-secrets -- `
            dist `
            src-tauri/target/release/respectabullz.exe `
            src-tauri/target/release/bundle
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $application = (Resolve-Path 'src-tauri/target/release/respectabullz.exe').Path
          $bundleFiles = @(Get-ChildItem `
            -LiteralPath src-tauri/target/release/bundle `
            -File -Recurse |
            Where-Object Extension -in @('.exe', '.msi'))
          if (-not $bundleFiles.Count) {
            throw 'No signed Windows installer was produced.'
          }
          $signableFiles = @($application) + @($bundleFiles.FullName)
          $signatureEvidence = foreach ($file in $signableFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for $file: $($signature.Status)."
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected signing certificate on $file."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "The signature on $file is not timestamped."
            }
            [pscustomobject]@{
              file = [System.IO.Path]::GetRelativePath((Resolve-Path '.').Path, $file)
              status = $signature.Status.ToString()
              signerThumbprint = $signature.SignerCertificate.Thumbprint
              timestamped = $true
            }
          }
          $signatureEvidence | ConvertTo-Json |
            Set-Content -LiteralPath artifacts/authenticode-verification.json -Encoding utf8

      - name: Create release checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path '.').Path
          $releaseFiles = @(
            Get-ChildItem -LiteralPath artifacts -File -Recurse
            Get-ChildItem -LiteralPath src-tauri/target/release/bundle -File -Recurse
          ) | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object FullName
          $releaseFiles | ForEach-Object {
            $relativePath = [System.IO.Path]::GetRelativePath($workspace, $_.FullName)
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relativePath"
          } | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding utf8

      - name: Remove imported signing material
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'respectabullz-signing.pfx'
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-signing.json'
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force
          }
          if (Test-Path -LiteralPath $configPath) {
            Remove-Item -LiteralPath $configPath -Force
          }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            $certificatePath = 'Cert:\CurrentUser\My\' + $env:WINDOWS_CERTIFICATE_THUMBPRINT
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Upload verified signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            artifacts/
            src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 30
